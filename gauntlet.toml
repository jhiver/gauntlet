# Gauntlet default configuration.
# Override per mission with a gauntlet.toml next to the mission file,
# or per run with --config FILE.

[harnesses.agy]
adapter = "agy"
supports_write = true
default_model = "gemini-3.7-flash-high"
launcher = "/Users/jhiver/aios/.reasonix/skills/antigravity-delegation/scripts/agy-delegate"
[harnesses.agy.errors]
quota = ["quota", "resource_exhausted", "429"]
auth  = ["unauthorized", "401"]
model_unavailable = ["Model is not available"]

[harnesses.codex]
adapter = "codex"
supports_write = true
default_model = "gpt-5.6-sol"
[harnesses.codex.errors]
quota = ["quota", "429", "insufficient_quota", "rate_limit_exceeded"]
auth  = ["unauthorized", "401", "authentication"]

[harnesses.cmd]
adapter = "cmd"
supports_write = true
default_model = "gpt-5.6-luna"
[harnesses.cmd.errors]
quota = ["insufficient[_ ]quota", "credit", "402"]
auth  = ["unauthorized", "401", "not logged in"]
model_unavailable = ["MODEL_NOT_IN_PLAN", "model is not available", "Unknown effort"]

[harnesses.kimi]
adapter = "kimi"
supports_write = true
default_model = "kimi-code/k3"
[harnesses.kimi.errors]
quota = ["quota", "429"]
auth  = ["unauthorized", "401"]

[harnesses.reasonix]
adapter = "reasonix"
supports_write = false
default_model = "deepseek-v4-flash"
[harnesses.reasonix.errors]
quota = ["quota", "429"]
auth  = ["unauthorized", "401"]

# Roles. Every chain implicitly ends with the "human" link.

[roles.implementer]
chain = [
  { harness = "agy" },
  { harness = "cmd", model = "gpt-5.6-luna", effort = "max" },
  { harness = "kimi" },
]

[roles.fixer]
chain = [
  { harness = "agy" },
  { harness = "codex", model = "gpt-5.6-sol", effort = "xhigh" },
  { harness = "cmd", model = "gpt-5.6-luna", effort = "max" },
]

[roles.reviewer]
chain = [
  { harness = "kimi", model = "kimi-code/k3" },
  { harness = "codex", model = "gpt-5.6-sol", effort = "xhigh" },
]

[roles.judge]
chain = [
  { harness = "kimi", model = "kimi-code/k3" },
  { harness = "codex", model = "gpt-5.6-sol", effort = "xhigh" },
]

[roles.planner]
chain = [
  { harness = "kimi", model = "kimi-code/k3" },
  { harness = "codex", model = "gpt-5.6-sol", effort = "xhigh" },
]

[roles.director]
chain = [{ harness = "human" }]

[policy]
checkpoints = ["plan", "deliver"]
# Fix waves are granted while the mission converges (each judgment must beat
# the lowest blocking-group count so far). max_total_waves is the absolute
# safety cap; on_wave_cap says what happens when convergence stalls:
# "checkpoint" asks the director for one more wave, "block" stops immediately.
max_total_waves = 5
on_wave_cap = "checkpoint"
idle_timeout_s = 900
hard_timeout_s = 2700
lane_timeout_s = 5400

[fallback]
on_quota = "next_and_break"
on_auth = "break"
on_rate_limit = "next"
on_model_unavailable = "next"
on_timeout = "retry_once_then_next"
on_crash = "retry_once_then_next"
on_invalid_output = "retry_once_then_next"
max_attempts_per_task = 3
