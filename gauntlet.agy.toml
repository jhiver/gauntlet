# Gauntlet AGY-Only Configuration
# All roles (planning, implementation, fix, review, judge) exclusively driven by AGY (Gemini 3.7 Flash High)

[harnesses.agy]
adapter = "agy"
supports_write = true
default_model = "gemini-3.7-flash-high"
launcher = "/Users/jhiver/aios/.reasonix/skills/antigravity-delegation/scripts/agy-delegate"
[harnesses.agy.errors]
quota = ["quota", "resource_exhausted", "429"]
auth  = ["unauthorized", "401"]
model_unavailable = ["Model is not available"]

# All role chains configured with AGY harness
[roles.implementer]
chain = [
  { harness = "agy", model = "gemini-3.7-flash-high", effort = "high" },
]

[roles.fixer]
chain = [
  { harness = "agy", model = "gemini-3.7-flash-high", effort = "high" },
]

[roles.reviewer]
chain = [
  { harness = "agy", model = "gemini-3.7-flash-high", effort = "high" },
]

[roles.judge]
chain = [
  { harness = "agy", model = "gemini-3.7-flash-high", effort = "high" },
]

[roles.planner]
chain = [
  { harness = "agy", model = "gemini-3.7-flash-high", effort = "high" },
]

[roles.director]
chain = [{ harness = "human" }]

[policy]
checkpoints = ["plan", "deliver"]
max_total_waves = 5
on_wave_cap = "checkpoint"
idle_timeout_s = 900
hard_timeout_s = 3600
lane_timeout_s = 7200

[fallback]
on_quota = "next_and_break"
on_auth = "break"
on_rate_limit = "backoff_retry_then_next"
on_model_unavailable = "next"
on_timeout = "retry_once_then_next"
on_crash = "retry_once_then_next"
on_invalid_output = "retry_once_then_next"
max_attempts_per_task = 3
